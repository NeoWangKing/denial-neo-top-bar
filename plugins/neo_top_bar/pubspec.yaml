name: neo_top_bar
description: A customizable Denial top bar with user-selectable modules.
publish_to: none
version: 0.0.0
environment:
  sdk: ^3.13.0
  flutter: 3.47.5
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  # Already a dependency of denial_flutter_sdk, which renders the shell's own
  # SVG branding with it, so this adds no new resolution constraint.
  flutter_svg: ^2.3.0
  denial_sdk: '0.0.0'
  denial_flutter_sdk: '0.0.0'
dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/archlinux-logo.svg

denial_plugin:
  schema: 1
  name: Neo Top Bar
  provides:
    - contract: package:denial_flutter_sdk/surfaces.dart#ShellSurface
    - contract: package:denial_flutter_sdk/surfaces.dart#ShellWorkArea
    - contract: package:denial_flutter_sdk/actions.dart#ShellAction
